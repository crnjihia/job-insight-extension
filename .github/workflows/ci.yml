name: CI & Extension Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit & integration tests
        run: npm test

      - name: Build extension and backend
        run: npm run build

      - name: Package extension ZIP
        run: npm run package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-insight-extension-v0.1.0
          path: job-insight-extension-v0.1.0.zip
          retention-days: 14
