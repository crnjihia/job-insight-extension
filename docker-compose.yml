version: '3.8'

services:
  backend:
    build: ./backend
    container_name: job-insight-backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb

  redis:
    image: redis:7-alpine
    container_name: job-insight-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: job-insight-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
